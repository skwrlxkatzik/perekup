const lvl=()=>{let l=0;LV.forEach((x,i)=>{if(S.xp>=x[1])l=i});return l};

/* ---------- car svg ---------- */

const wh=x=>`<g transform="translate(${x} 96)"><circle r="25" fill="#06080b"/><circle r="21" fill="#111"/><circle r="14" fill="url(#rim)"/><g class="sp" style="transform-origin:0 0;animation:spin ${rust?'6s':'1.4s'} linear 1;"><path d="M0-13V13M-13 0H13M-9-9 9 9M-9 9 9-9" stroke="#2a323a" stroke-width="2.4"/></g><circle r="4" fill="#ffc83a"/></g>`;

/* market */
function market(m){if(!S.mk)S.mk=Array.from({length:8},gen);
m.innerHTML=`<div class="scr"><div class="row"><h2>Объявления</h2><span class="sp"></span><button class="btn s" id="rf">${ic('scan')}Обновить −2</button></div>`+S.mk.map((c,i)=>{const pr=R(c.base*.95-c.ask);return `<div class="plate card" style="animation-delay:${i*60}ms"><div class="pic"><span class="tag">${c.y} · ${c.km/1000}к км</span>${car(c)}</div><div class="info"><b class="rus" style="font-size:14px;line-height:1.1">${c.name}</b><div class="price"><div>${c.ask}$<small>цена</small></div><div class="${pr>0?'p':'n'}">${pr>0?'+':''}${pr}$<small>доход</small></div></div><button class="btn g" data-i="${i}">${ic('phone')}Позвонить −1${ic('bolt')}</button></div></div>`}).join('')+'</div>';

<div class="plate"><div class="row"><div class="bubble">«${c.says}»</div><div class="ava"></div></div></div>
<div class="row" style="margin-bottom:10px"><button class="btn g sp" id="by">Купить ${c.ask-c.dis}$</button><button class="btn sp" id="hg">Торг −1${ic('bolt')}</button></div>

$('#hg').onclick=ev=>{if(c.dis>=c.ask*.15)return toast('Продавец больше не уступает');if(!spend(1))return;snd('neg');if(Math.random()<.65){const d=R(c.ask*(.03+Math.random()*.06));c.dis+=d;toast('Скидка '+d+'$');snd('coin')}else{toast('Продавец стоит на своём');snd('err')}draw()};

function garage(m){m.innerHTML=`<div class="scr"><h2>Ваш гараж</h2>`+(S.g.length?S.g.map((c,i)=>`<div class="plate"><div class="stage" style="height:130px;margin-bottom:8px"><div class="lamp"></div>${car(c)}</div><div class="row"><b class="rus">${c.name}</b><span class="sp"></span><span class="mut">куплена за ${c.paid}$</span></div>
<div class="parts" style="margin:8px 0">${PARTS.map(p=>{const k=c.kn[p[0]],w=c.w[p[0]],fx=p[0]=='docs'?c.fake&&k:w>8;return `<div class="part" data-i="${i}" data-p="${p[0]}">${ic(p[2])}<b style="font-size:13px">${p[1]}</b>${p[0]=='docs'?`<div class="mut" style="color:${k&&c.fake?'#ff5a4a':''}">${!k?'Проверить −1⚡':c.fake?'Оформить '+R(c.base*.12)+'$':'Чистые'}</div>`:`<div class="wear"><i style="width:${k?w:0}%;background:${wearCol(w)}"></i></div><div class="mut">${!k?'Проверить −1⚡':w>8?'Ремонт '+R(w*c.base*.005)+'$':'Идеал'}</div>`}</div>`}).join('')}</div>
